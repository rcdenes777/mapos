server {
    listen ${NGINX_PORT} default_server;
    listen [::]:${NGINX_PORT} default_server;
    server_name ${NGINX_HOST};

    root /var/www/html;
    index index.html index.php;
    client_max_body_size 320M;

    # . files
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Diretórios de código: o bloco `~* \.php$` abaixo entrega QUALQUER .php ao
    # php-fpm, inclusive migrations, models e configs, que rodariam sem o
    # bootstrap do CI (fatal com caminho absoluto na resposta) ou vazariam
    # conteúdo. Nada aqui deve ser alcançável por HTTP, nem na porta interna.
    location ^~ /application/ {
        deny all;
    }

    location ^~ /system/ {
        deny all;
    }

    # set expiration of assets to MAX for caching
    location ~* \.(ico|css|js|gif|jpe?g|png)(\?[0-9]+)?$ {
        expires max;
        log_not_found off;
    }

    # index.php
    index index.php;

    location / {
        # Check if a file or directory index file exists, else route it to index.php.
        try_files $uri $uri/ /index.php;
    }

    location ~* \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }
}

# ---------------------------------------------------------------------------
# Porta pública (${NGINX_PUBLIC_PORT}) — é ESTA que o Cloudflare Tunnel expõe.
#
# Aqui vale allowlist: nega tudo por padrão e libera apenas /publico/* mais os
# estáticos de aparência. O painel administrativo, o portal do cliente, o
# login, a API e os anexos estáticos NÃO existem nesta porta.
#
# Por que uma porta separada em vez de `deny` na porta 8000: o painel e o
# portal logado servem anexo por `assets/anexos/...` (coluna `url` da tabela
# `anexos`, usada em os/editarOs.php, os/visualizarOs.php, os/imprimirOs.php,
# conecte/detalhes_os.php e conecte/visualizar_os.php). Bloquear esse caminho
# na porta interna quebraria o uso do técnico e do cliente logado. Separando
# as portas, a rede local continua com acesso normal e a internet só alcança
# o que está liberado abaixo.
# ---------------------------------------------------------------------------
server {
    listen ${NGINX_PUBLIC_PORT};
    listen [::]:${NGINX_PUBLIC_PORT};
    server_name ${NGINX_HOST};

    root /var/www/html;

    # Nada é enviado para cá; upload grande só pela porta interna.
    client_max_body_size 1M;

    # Arquivos ocultos (.env, .git, ...)
    location ~ /\. {
        deny all;
    }

    # PADRÃO: nega tudo que não estiver explicitamente liberado adiante.
    location / {
        return 404;
    }

    # Única rota de aplicação liberada. O arquivo nunca existe em disco, então
    # try_files cai no front controller; o CodeIgniter lê REQUEST_URI
    # ($config['uri_protocol'] = 'REQUEST_URI') e roteia para Publico::os().
    location ^~ /publico/ {
        try_files $uri /index.php;
    }

    # Estáticos de aparência da página pública (CSS, ícones, logos).
    # Sem dado de cliente: a página quebra visualmente sem eles.
    location ^~ /assets/css/ {
        expires max;
        log_not_found off;
    }

    location ^~ /assets/font-awesome/ {
        expires max;
        log_not_found off;
    }

    location ^~ /assets/img/ {
        expires max;
        log_not_found off;
    }

    # Bloqueio explícito e redundante do que nunca pode sair por aqui.
    # (o `location /` acima já negaria; isto documenta a intenção e protege
    # contra alguém liberar /assets/ inteiro por engano no futuro)
    location ^~ /assets/anexos/ {
        return 404;
    }

    location ^~ /assets/os/ {
        return 404;
    }

    location ^~ /assets/uploads/ {
        return 404;
    }

    # Front controller acessível SOMENTE por redirect interno do try_files
    # acima. `internal` faz o nginx responder 404 a um pedido direto de
    # /index.php, o que impede http://dominio/index.php/os/editar/2 de
    # alcançar o painel por esta porta.
    location = /index.php {
        internal;

        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    # Nenhum outro .php é executável por esta porta.
    location ~* \.php$ {
        return 404;
    }
}
